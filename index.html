<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COCOA 2026 · Programa completo</title>
<style>
  :root{
    --paper:#faf7f0;
    --paper-line:#ded7c4;
    --ink:#1c2a36;
    --ink-soft:#57636d;
    --navy:#0b2e59;
    --navy-soft:#3a5678;
    --brick:#a3321c;
    --brick-soft:#c9603f;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:900px;margin:0 auto;padding:32px 18px 80px;}

  header{ text-align:center; margin-bottom:22px; }
  .kicker{ font-size:13px; color:var(--ink-soft); margin:0 0 6px; }
  h1{
    font-family:Iowan Old Style, Palatino Linotype, Georgia, "Times New Roman", serif;
    font-weight:600;
    font-size:clamp(28px,5vw,40px);
    margin:0 0 4px;
    color:var(--navy);
  }
  .subline{ color:var(--ink-soft); font-size:14.5px; margin:0; }

  .rule{
    height:1px;
    background:linear-gradient(to right, transparent, var(--paper-line) 15%, var(--paper-line) 85%, transparent);
    margin:20px 0;
  }

  /* Day tabs */
  .days{
    display:flex;
    gap:6px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:22px;
  }
  .day-btn{
    border:1px solid var(--paper-line);
    background:var(--card);
    color:var(--ink-soft);
    font-size:13px;
    font-weight:600;
    padding:9px 14px;
    border-radius:20px;
    cursor:pointer;
    transition:all .15s ease;
    text-align:left;
    line-height:1.3;
  }
  .day-btn .d-name{ display:block; color:var(--navy); font-size:13.5px; }
  .day-btn .d-venue{ display:block; font-weight:400; font-size:11px; color:var(--ink-soft); }
  .day-btn.active{ background:var(--navy); border-color:var(--navy); }
  .day-btn.active .d-name, .day-btn.active .d-venue{ color:#fff; }

  /* General day info */
  .general{
    margin-bottom:22px;
  }
  .general-title{
    font-size:12.5px;
    font-weight:700;
    color:var(--brick);
    letter-spacing:.02em;
    margin:0 0 8px 2px;
  }
  .general-list{ display:flex; flex-direction:column; gap:6px; }
  .g-item{
    display:flex;
    gap:10px;
    align-items:baseline;
    font-size:13px;
    padding:5px 2px;
    border-bottom:1px dashed var(--paper-line);
  }
  .g-item .g-time{ flex:0 0 96px; font-weight:600; color:var(--navy-soft); }
  .g-item .g-text{ color:var(--ink); }
  .g-item .g-text b{ font-weight:600; }
  .g-item .g-loc{ color:var(--ink-soft); font-style:italic; }

  /* Room plates */
  .plates{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:8px;
  }
  .plate{
    position:relative;
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:3px;
    padding:14px 10px 12px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .plate:hover{ transform:translateY(-1px); }
  .plate .room-name{
    font-family:Iowan Old Style, Palatino Linotype, Georgia, serif;
    font-size:18px;
    color:var(--navy);
    font-weight:600;
  }
  .plate .room-track{ font-size:11px; color:var(--brick); margin-top:6px; min-height:14px; }
  .plate.active{ border-color:var(--navy); box-shadow:0 2px 0 var(--navy); }
  .plate::before{
    content:"";
    position:absolute; left:50%; top:6px; transform:translateX(-50%);
    width:26px; height:3px; border-radius:2px; background:var(--paper-line);
  }
  .plate.active::before{ background:var(--brick-soft); }

  /* Search */
  .search-row{ margin:18px 0 6px; display:flex; justify-content:center; }
  .search-row input{
    width:100%; max-width:420px; font-size:14px; padding:9px 14px;
    border:1px solid var(--paper-line); border-radius:20px;
    background:var(--card); color:var(--ink); outline:none;
    transition:border-color .15s ease; font-family:inherit;
  }
  .search-row input:focus{ border-color:var(--navy-soft); }
  .search-hint{ text-align:center; font-size:12px; color:var(--ink-soft); margin:6px 0 0; min-height:16px; }

  /* Search results (whole program) */
  .results{ margin-top:22px; }
  .res-group{ margin-bottom:30px; }
  .res-head{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    border-bottom:1px solid var(--paper-line); padding-bottom:6px; margin-bottom:16px;
  }
  .res-head .r-day{
    font-size:12.5px; font-weight:700; color:var(--brick); letter-spacing:.02em;
  }
  .res-head .r-room{
    font-family:Iowan Old Style, Palatino Linotype, Georgia, serif;
    font-size:16px; color:var(--navy);
  }
  .res-head .r-count{ font-size:11.5px; color:var(--ink-soft); margin-left:auto; }
  .is-hidden{ display:none !important; }

  /* Timeline */
  .timeline{ margin-top:22px; position:relative; padding-left:78px; }
  .timeline::before{
    content:""; position:absolute; left:64px; top:6px; bottom:6px; width:1px; background:var(--paper-line);
  }
  .slot{ position:relative; margin-bottom:16px; }
  .slot .time{
    position:absolute; left:-78px; top:2px; width:64px; text-align:right;
    font-size:12.5px; font-weight:600; color:var(--navy-soft); line-height:1.35;
  }
  .slot .dot{
    position:absolute; left:-19px; top:6px; width:9px; height:9px; border-radius:50%;
    background:var(--navy); border:2px solid var(--paper);
  }
  .slot.break .dot, .slot.lunch .dot, .slot.info .dot{ background:var(--paper-line); }
  .slot.keynote .dot{ background:var(--brick); }

  .entry{ background:var(--card); border:1px solid var(--paper-line); border-radius:6px; padding:12px 16px; }
  .entry.hidden{ display:none; }
  .slot.break .entry, .slot.lunch .entry, .slot.info .entry{
    background:transparent; border:none; padding:4px 0 4px 2px;
    font-style:italic; color:var(--ink-soft); font-size:13.5px;
  }
  .entry .tag-row{ display:flex; align-items:baseline; gap:8px; margin-bottom:4px; flex-wrap:wrap; }
  .entry .code{
    font-size:11px; font-weight:700; color:var(--brick); background:#f6e9e4;
    padding:1px 6px; border-radius:3px; letter-spacing:.01em;
  }
  .entry .keynote-label{
    font-size:11px; font-weight:700; color:#fff; background:var(--brick);
    padding:2px 7px; border-radius:3px; letter-spacing:.01em;
  }
  .entry .speaker{ font-size:13.5px; color:var(--ink-soft); }
  .entry .affil{ font-size:12px; color:var(--ink-soft); opacity:.85; margin-top:4px; }
  .entry .title{
    font-family:Iowan Old Style, Palatino Linotype, Georgia, serif;
    font-size:16px; line-height:1.4; color:var(--ink); margin:0;
  }
  .entry.keynote .title{ font-size:18px; }

  footer{ text-align:center; margin-top:40px; font-size:12px; color:var(--ink-soft); }

  @media (max-width:520px){
    .plates{ grid-template-columns:1fr; }
    .timeline{ padding-left:64px; }
    .timeline::before{ left:52px; }
    .slot .time{ left:-64px; width:50px; font-size:11.5px; }
    .slot .dot{ left:-16px; }
    .g-item{ flex-direction:column; gap:2px; }
    .g-item .g-time{ flex:none; }
  }
</style>
</head>

let currentDay = "jueves";
let currentRoom = "s1";
let currentQuery = "";

function renderDays(){
  const el = document.getElementById('days');
  el.innerHTML = "";
  Object.keys(WEEK).forEach(key=>{
    const d = WEEK[key];
    const btn = document.createElement('div');
    btn.className = 'day-btn' + (key===currentDay ? ' active' : '');
    btn.innerHTML = `<span class="d-name">${d.dayName}</span><span class="d-venue">${d.venue}</span>`;
    btn.addEventListener('click', ()=>{
      currentDay = key;
      currentRoom = "s1";
      // Salir del modo búsqueda al elegir un día.
      currentQuery = "";
      document.getElementById('search').value = "";
      render();
    });
    el.appendChild(btn);
  });
}

function renderGeneral(){
  const day = WEEK[currentDay];
  const el = document.getElementById('general');
  if(!day.general || day.general.length === 0){ el.innerHTML = ""; return; }
  let html = `<p class="general-title">Actividades generales del día</p><div class="general-list">`;
  day.general.forEach(item=>{
    html += `<div class="g-item">
      <span class="g-time">${item.time}</span>
      <span class="g-text">${item.text}${item.loc ? ` — <span class="g-loc">${item.loc}</span>` : ""}</span>
    </div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
}

function renderPlates(){
  const day = WEEK[currentDay];
  const plates = document.getElementById('plates');
  plates.innerHTML = "";
  Object.keys(day.rooms).forEach(key=>{
    const room = day.rooms[key];
    const div = document.createElement('div');
    div.className = 'plate' + (key===currentRoom ? ' active' : '');
    div.innerHTML = `
      <div class="room-name">${room.name}</div>
      <div class="room-track">${room.track}</div>
    `;
    div.addEventListener('click', ()=>{
      currentRoom = key;
      renderPlates();
      renderTimeline();
    });
    plates.appendChild(div);
  });
}

function matches(slot, q){
  if(!q) return true;
  const hay = ((slot.speaker||"") + " " + (slot.title||"") + " " + (slot.code||"") + " "
    + (slot.affil||"") + " " + (slot.label||"")).toLowerCase();
  return hay.includes(q);
}

function isFiller(slot){
  return slot.type === 'break' || slot.type === 'lunch' || slot.type === 'info';
}

function entryHtml(slot){
  if(slot.type === 'keynote'){
    return `
      <div class="entry keynote">
        <div class="tag-row"><span class="keynote-label">${slot.label}</span></div>
        <p class="title">«${slot.title}»</p>
        <div class="speaker">Por: ${slot.speaker}</div>
      </div>`;
  }
  if(isFiller(slot)){
    return `<div class="entry">${slot.title}</div>`;
  }
  return `
    <div class="entry">
      <div class="tag-row"><span class="code">${slot.code}</span><span class="speaker">${slot.speaker}</span></div>
      <p class="title">${slot.title}</p>
      ${slot.affil ? `<div class="affil">${slot.affil}</div>` : ""}
    </div>`;
}

function slotNode(slot){
  const wrap = document.createElement('div');
  wrap.className = 'slot ' + slot.type;
  wrap.innerHTML = `
    <div class="time">${slot.time}</div>
    <div class="dot"></div>
    ${entryHtml(slot)}
  `;
  return wrap;
}

// Vista normal: un día, una sala, todo el bloque completo.
function renderTimeline(){
  const day = WEEK[currentDay];
  const room = day.rooms[currentRoom];
  const tl = document.getElementById('timeline');
  tl.innerHTML = "";
  room.slots.forEach(slot=> tl.appendChild(slotNode(slot)));
}

// Vista búsqueda: recorre toda la semana y agrupa por día y sala.
function renderResults(){
  const q = currentQuery.trim().toLowerCase();
  const el = document.getElementById('results');
  el.innerHTML = "";
  let total = 0;

  Object.keys(WEEK).forEach(dayKey=>{
    const day = WEEK[dayKey];
    Object.keys(day.rooms).forEach(roomKey=>{
      const room = day.rooms[roomKey];
      const hits = room.slots.filter(slot=> !isFiller(slot) && matches(slot, q));
      if(hits.length === 0) return;
      total += hits.length;

      const group = document.createElement('div');
      group.className = 'res-group';
      const head = document.createElement('div');
      head.className = 'res-head';
      head.innerHTML = `
        <span class="r-day">${day.dayName}</span>
        <span class="r-room">${room.name}</span>
        <span class="r-count">${hits.length} resultado${hits.length===1?'':'s'}</span>
      `;
      group.appendChild(head);

      const tl = document.createElement('div');
      tl.className = 'timeline';
      tl.style.marginTop = '0';
      hits.forEach(slot=> tl.appendChild(slotNode(slot)));
      group.appendChild(tl);
      el.appendChild(group);
    });
  });

  const hint = document.getElementById('searchHint');
  hint.textContent = total === 0
    ? `Sin resultados para "${currentQuery.trim()}" en todo el programa.`
    : `${total} resultado${total===1?'':'s'} en todo el programa.`;
  return total;
}

function render(){
  const searching = currentQuery.trim().length > 0;
  renderDays();
  renderGeneral();
  renderPlates();
  renderTimeline();

  document.getElementById('general').classList.toggle('is-hidden', searching);
  document.getElementById('plates').classList.toggle('is-hidden', searching);
  document.getElementById('timeline').classList.toggle('is-hidden', searching);
  document.getElementById('results').classList.toggle('is-hidden', !searching);

  if(searching){
    renderResults();
  } else {
    document.getElementById('results').innerHTML = "";
    document.getElementById('searchHint').textContent = "";
  }
}

document.getElementById('search').addEventListener('input', (e)=>{
  currentQuery = e.target.value;
  render();
});

render();
</script>
